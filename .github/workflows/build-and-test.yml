name: build-and-test

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - name: Check formatting
        run: dotnet format InternFlow.slnx --verify-no-changes --verbosity diagnostic

  build-and-test:
    runs-on: ubuntu-latest
    needs: format-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - run: dotnet restore InternFlow.slnx
      - run: dotnet build InternFlow.slnx --no-restore -c Release
      - run: dotnet test InternFlow.slnx --no-build -c Release